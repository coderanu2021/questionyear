name: Deploy to AWS Lightsail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightsail-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Laravel
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST || '13.127.237.199' }}
      LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER || 'admin' }}
      LIGHTSAIL_SSH_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY_B64 }}
      LIGHTSAIL_KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
      LIGHTSAIL_DEPLOY_PATH: ${{ secrets.LIGHTSAIL_DEPLOY_PATH || '/home/admin/questionyear' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          : "${LIGHTSAIL_SSH_KEY_B64:?Add the LIGHTSAIL_SSH_KEY_B64 repository secret}"
          : "${LIGHTSAIL_KNOWN_HOSTS:?Add the LIGHTSAIL_KNOWN_HOSTS repository secret}"
          [[ "$LIGHTSAIL_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$LIGHTSAIL_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$LIGHTSAIL_DEPLOY_PATH" =~ ^/[A-Za-z0-9/_-]+$ ]]
          [[ "$LIGHTSAIL_DEPLOY_PATH" != / && "$LIGHTSAIL_DEPLOY_PATH" != *..* ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s' "$LIGHTSAIL_SSH_KEY_B64" | base64 --decode > "$HOME/.ssh/lightsail"
          printf '%s\n' "$LIGHTSAIL_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/lightsail" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -P '' -f "$HOME/.ssh/lightsail" > /dev/null
          cat > "$HOME/.ssh/config" <<CONFIG
          Host lightsail-deploy
            HostName $LIGHTSAIL_HOST
            User $LIGHTSAIL_USER
            IdentityFile ~/.ssh/lightsail
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
            ServerAliveCountMax 3
          CONFIG
          chmod 600 "$HOME/.ssh/config"

      - name: Check server before deployment
        run: |
          set -euo pipefail
          ssh lightsail-deploy "bash -s -- $(printf '%q' "$LIGHTSAIL_DEPLOY_PATH")" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          [[ "$(git rev-parse --show-toplevel)" == "$(pwd -P)" ]]
          [[ "$(git branch --show-current)" == main ]]
          [[ -f .env && -f artisan && -f composer.lock ]]
          [[ -w storage && -w bootstrap/cache && -w public ]]
          [[ ! -L public/build ]]
          command -v php
          command -v composer
          command -v rsync
          php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);'
          REMOTE

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend assets
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-package-lock --no-audit --no-fund
          fi
          npm run build
          test -f public/build/manifest.json

      - name: Update server checkout to this commit
        run: |
          set -euo pipefail
          ssh lightsail-deploy "bash -s -- $(printf '%q' "$LIGHTSAIL_DEPLOY_PATH") $(printf '%q' "$GITHUB_SHA")" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          git fetch origin main
          git cat-file -e "$2^{commit}"
          git merge --ff-only "$2"
          [[ "$(git rev-parse HEAD)" == "$2" ]]
          REMOTE

      - name: Upload built frontend assets
        run: |
          set -euo pipefail
          rsync --recursive --links --times --compress --delete --protect-args \
            -e "ssh" public/build/ "lightsail-deploy:$LIGHTSAIL_DEPLOY_PATH/public/build/"

      - name: Install dependencies, migrate and refresh Laravel
        run: |
          set -euo pipefail
          ssh lightsail-deploy "bash -s -- $(printf '%q' "$LIGHTSAIL_DEPLOY_PATH")" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          composer check-platform-reqs --no-dev
          php artisan optimize:clear --no-interaction
          php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (! $app->isProduction()) { fwrite(STDERR, "Deployment requires APP_ENV=production to protect live data.\n"); exit(1); }'
          php artisan migrate --force --no-interaction
          php artisan optimize --no-interaction
          php artisan queue:restart --no-interaction
          git log -1 --oneline
          REMOTE

      - name: Check deployed application
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 5 \
            https://questionyear.in/up

      - name: Remove runner SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/lightsail" "$HOME/.ssh/known_hosts" "$HOME/.ssh/config"
